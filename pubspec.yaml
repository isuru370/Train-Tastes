name: train_tastes
description: A new Flutter project.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_native_splash: ^2.3.7
  flutter_bloc: ^8.1.5
  # provider: ^6.1.2
  iconsax: ^0.0.8
  smooth_page_indicator: ^1.1.0
  flutter_pannable_rating_bar: ^2.7.2+1
  carousel_slider: ^4.2.1
  firebase_core: ^2.24.2
  firebase_app_check: ^0.2.1+8
  equatable: ^2.0.5
  persistent_bottom_nav_bar: ^5.0.2

  # --- firebase ---
  firebase_auth: ^4.16.0
  

  # Custom Repository
  user_repository:
    path: packages/user_repository
  
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/images/background/
  - assets/images/logo/
  - assets/images/intro/
  - assets/icons/
  - assets/lottie/

  # list giving the asset and other descriptors for the font. For
  fonts:
    - family: Poppins
      fonts:
        - asset: assets\fonts\Poppins-Regular.ttf
        - asset: assets\fonts\Poppins-Bold.ttf
        - asset: assets\fonts\Poppins-Italic.ttf
        - asset: assets\fonts\Poppins-Medium.ttf
    # - family: Oswald
      # fonts:
      #   - asset: assets\fonts\Oswald-Bold.ttf
      #   - asset: assets\fonts\Oswald-Regular.ttf
      #   - asset: assets\fonts\Oswald-ExtraLight.ttf
      #   - asset: assets\fonts\Oswald-Medium.ttf


#  Native Splash Screen 
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo/logo1152px.png"
  android: true
  ios: true